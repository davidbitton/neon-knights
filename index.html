<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Neon Knights: A Gentleman's Evening Out</title>
  <link data-trunk rel="rust" data-wasm-opt="z" data-integrity="none" />
  <style>
    html, body { margin: 0; height: 100%; background: #000; color: #aaa; font-family: monospace; }
    body { display: flex; flex-direction: column; align-items: center; justify-content: center; }
    #screen {
      position: relative;
      width: min(96vw, calc(92vh * 1.6));
      aspect-ratio: 16 / 10;
      box-shadow: 0 0 40px #ff55ff44;
    }
    #game {
      position: absolute; inset: 0; width: 100%; height: 100%;
      image-rendering: pixelated; image-rendering: crisp-edges; cursor: crosshair;
    }
    footer { font-size: 12px; margin-top: 6px; color: #555; }
  </style>
  <script>
    // Google Analytics (GA4). Only on the public Pages site, never in local runs or ?test mode.
    if (location.hostname === 'davidbitton.github.io' && !location.search.includes('test')) {
      var ga = document.createElement('script');
      ga.async = true;
      ga.src = 'https://www.googletagmanager.com/gtag/js?id=G-SRHPXEMN3B';
      document.head.appendChild(ga);
      window.dataLayer = window.dataLayer || [];
      window.gtag = function () { dataLayer.push(arguments); };
      gtag('js', new Date());
      gtag('config', 'G-SRHPXEMN3B');
    }
  </script>
</head>
<body>
  <div id="screen">
    <canvas id="game" width="320" height="200"></canvas>
  </div>
  <footer>Neon Knights is an original parody. Type commands, arrows to walk, click to walk/interact, M toggles sound.</footer>
</body>
</html>
