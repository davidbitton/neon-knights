# Based on GitHub's Rust starter workflow (actions/starter-workflows, ci/rust.yml),
# extended with formatting, lints for both targets, and a wasm32 build.
name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always
  # The code uses recent stable APIs (u32::is_multiple_of, Option::is_none_or),
  # so pin the toolchain it's developed and tested with.
  RUST_TOOLCHAIN: "1.99.1"

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Install Rust ${{ env.RUST_TOOLCHAIN }}
      run: |
        rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal \
          --component rustfmt,clippy --target wasm32-unknown-unknown
        rustup default "$RUST_TOOLCHAIN"
        rustc --version
    - uses: Swatinem/rust-cache@v2
    - name: Check formatting
      run: cargo fmt --all --check
    - name: Build
      run: cargo build --verbose
    - name: Run tests
      run: cargo test --verbose
    - name: Clippy (native)
      run: cargo clippy --all-targets --verbose -- -D warnings
    - name: Clippy (wasm32)
      run: cargo clippy --target wasm32-unknown-unknown --verbose -- -D warnings
    - name: Build (wasm32)
      run: cargo build --release --target wasm32-unknown-unknown --verbose
