# Build the game with trunk and publish it to GitHub Pages at
# https://davidbitton.github.io/neon-knights/
name: Pages

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; let an in-progress deployment finish.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.99.1"
  TRUNK_VERSION: "0.22.0"
  # The site is served from a project subpath, so every asset URL trunk
  # writes into index.html must start with it.
  PUBLIC_URL: /neon-knights/

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Install Rust ${{ env.RUST_TOOLCHAIN }}
      run: |
        rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --target wasm32-unknown-unknown
        rustup default "$RUST_TOOLCHAIN"
    - uses: Swatinem/rust-cache@v2
    - name: Install trunk ${{ env.TRUNK_VERSION }}
      run: |
        base="https://github.com/trunk-rs/trunk/releases/download/v${TRUNK_VERSION}"
        file="trunk-x86_64-unknown-linux-gnu.tar.gz"
        curl -fsSLO "$base/$file"
        curl -fsSLO "$base/$file.sha256"
        # The .sha256 file holds just the hash.
        echo "$(awk '{print $1}' "$file.sha256")  $file" | sha256sum -c -
        mkdir -p "$HOME/.local/bin"
        tar -xzf "$file" -C "$HOME/.local/bin" trunk
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
    - name: Build site
      run: |
        trunk --version
        trunk build --release --public-url "$PUBLIC_URL"
        ls -l dist
    - uses: actions/configure-pages@v6
    - uses: actions/upload-pages-artifact@v5
      with:
        path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v5
