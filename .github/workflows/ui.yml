# Browser UI tests: functional (real keyboard/mouse input, frozen game clock)
# and visual regression (the game's own 320x200 framebuffer vs. committed
# baselines in tests/visual/baseline/). See tests/ui/.
name: UI tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.99.1"
  TRUNK_VERSION: "0.22.0"
  PYTHON_VERSION: "3.13"

jobs:
  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v7
    - name: Install Rust ${{ env.RUST_TOOLCHAIN }}
      run: |
        rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --target wasm32-unknown-unknown
        rustup default "$RUST_TOOLCHAIN"
    - uses: Swatinem/rust-cache@v2
    - name: Install trunk ${{ env.TRUNK_VERSION }}
      run: |
        base="https://github.com/trunk-rs/trunk/releases/download/v${TRUNK_VERSION}"
        file="trunk-x86_64-unknown-linux-gnu.tar.gz"
        curl -fsSLO "$base/$file"
        curl -fsSLO "$base/$file.sha256"
        # The .sha256 file holds just the hash.
        echo "$(awk '{print $1}' "$file.sha256")  $file" | sha256sum -c -
        mkdir -p "$HOME/.local/bin"
        tar -xzf "$file" -C "$HOME/.local/bin" trunk
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
    - name: Build the game
      run: trunk build --release

    - uses: actions/setup-python@v7
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: pip
        cache-dependency-path: tests/requirements.txt
    - name: Install test dependencies (pinned)
      id: deps
      run: |
        python -m pip install -r tests/requirements.txt
        echo "playwright=$(python -c 'import importlib.metadata as m; print(m.version("playwright"))')" >> "$GITHUB_OUTPUT"
    - name: Cache Playwright browsers
      id: pw-cache
      uses: actions/cache@v6
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ steps.deps.outputs.playwright }}-chromium
    - name: Install Chromium and its system dependencies
      if: steps.pw-cache.outputs.cache-hit != 'true'
      run: python -m playwright install --with-deps chromium
    - name: Install Chromium system dependencies (browser cached)
      if: steps.pw-cache.outputs.cache-hit == 'true'
      run: python -m playwright install-deps chromium

    # The suite serves dist/ itself on a free port; it fails on any test
    # failure, console error/warning, or uncaught page error.
    - name: Run UI tests
      run: python -m pytest tests/ui -v

    - name: Upload diffs and failure screenshots
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: ui-test-results
        path: |
          tests/visual/output/
          tests/ui/test-results/
        if-no-files-found: ignore
        retention-days: 14
