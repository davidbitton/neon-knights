[package]
name = "neon-knights"
version = "0.1.0"
edition = "2021"
rust-version = "1.87"
description = "Neon Knights: A Gentleman's Evening Out - an original parody adventure in the style of late-1980s parser adventures"
license = "MIT"
repository = "https://github.com/davidbitton/neon-knights"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
  "Window", "Document", "Element", "HtmlElement", "HtmlCanvasElement",
  "CanvasRenderingContext2d", "ImageData", "KeyboardEvent", "MouseEvent",
  "Event", "EventTarget", "Storage", "DomRect", "console",
  "AudioContext", "AudioContextState", "BaseAudioContext", "AudioNode",
  "AudioParam", "AudioDestinationNode", "AudioScheduledSourceNode",
  "OscillatorNode", "OscillatorType", "GainNode",
] }
console_error_panic_hook = "0.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
